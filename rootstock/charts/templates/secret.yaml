{{- if not .Values.rootstock.redfish.existingSecret }}
{{- if not .Values.redfish.access }}
{{- fail "redfish.access must be set when rootstock.redfish.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootstock.fullname" . }}-redfish
  namespace: {{ include "rootstock.namespace" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
type: Opaque
data:
  redfish_pdus.yaml: {{ .Values.redfish.access | toYaml | b64enc }}
{{- end }}
