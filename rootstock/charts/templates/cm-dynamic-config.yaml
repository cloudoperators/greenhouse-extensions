apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootstock.fullname" . }}-config
  namespace: {{ include "rootstock.namespace" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
data:
  .rootstock.yaml: |
    rootstock:
    {{- .Values.rootstock | toYaml | nindent 6 }}
