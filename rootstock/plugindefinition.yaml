apiVersion: greenhouse.sap/v1alpha1
kind: PluginDefinition
metadata:
  name: rootstock
spec:
  version: 0.1.0
  displayName: rootstock
  description: >-
    Data-center energy/carbon telemetry collector. Scrapes Redfish targets and
    exposes Prometheus metrics using a multi-target probe pattern.
  helmChart:
    name: rootstock
    repository: "oci://ghcr.io/cloudoperators/greenhouse-extensions/charts"
    version: 0.1.0
  options:
    - name: image.repository
      description: Container image repository for rootstock.
      type: string
      required: false
      default: "ghcr.io/cloudoperators/rootstock"
    - name: image.tag
      description: Container image tag. Defaults to the chart appVersion when empty.
      type: string
      required: false
    - name: image.pullPolicy
      description: Kubernetes image pull policy for rootstock.
      type: string
      required: false
      default: IfNotPresent
    - name: rootstock.redfish.password
      displayName: Redfish password
      description: >-
        Password for Redfish authentication. Supply via valueFrom.secret so it
        is mounted into the pod as a file (never set as an environment variable).
      type: secret
      required: true
    - name: serviceMonitor.enabled
      displayName: Enable ServiceMonitor
      description: Create a Prometheus Operator ServiceMonitor for /metrics.
      type: bool
      required: false
      default: false