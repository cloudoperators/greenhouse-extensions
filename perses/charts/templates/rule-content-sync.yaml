{{- if and .Values.perses.serviceMonitor.selfMonitor .Values.greenhouse.prometheusRule.contentSync.enabled }}
{{- $jobName := printf "%s-content-sync-.*" (include "release.name" .) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "release.name" . }}-content-sync-alerts
  labels:
    {{- include "perses.labels" . | nindent 4 }}
    {{- with .Values.greenhouse.prometheusRule.contentSync.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: perses-content-sync
      rules:
        - alert: PersesContentSyncJobFailed
          annotations:
            summary: "Perses content sync job failed"
            description: "The most recent Perses content sync Job in namespace {{`{{ $labels.namespace }}`}} has failed. The Perses provisioning PVC has not been updated; new dashboards and datasources will not appear until the sync succeeds."
          {{- /* Fire only while the newest failed Job is newer than the newest succeeded one
                 (0 if none succeeded), so a failed Job kept by failedJobsHistoryLimit does not
                 keep the alert firing after later runs succeed. */}}
          expr: |
            max by (namespace) (
              max by (namespace, job_name) (kube_job_created{job_name=~"{{ $jobName }}"})
              * on (namespace, job_name)
              max by (namespace, job_name) (kube_job_failed{job_name=~"{{ $jobName }}",condition="true"})
            )
            >
            max by (namespace) (
              max by (namespace, job_name) (kube_job_created{job_name=~"{{ $jobName }}"})
              * on (namespace, job_name)
              max by (namespace, job_name) (kube_job_status_succeeded{job_name=~"{{ $jobName }}"} > bool 0)
            )
          for: 5m
          labels:
            severity: warning
            playbook: https://github.com/cloudoperators/greenhouse-extensions/blob/main/perses/playbooks/PersesContentSyncJobFailed.md
            {{- include "perses.alertLabels" . | nindent 12 }}
{{- end }}
