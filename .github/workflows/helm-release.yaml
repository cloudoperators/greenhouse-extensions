name: Package Helm Chart and publish to GitHub Packages

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/helm-release.yaml
      - external-dns/charts/**
      - absent-metrics-operator/charts/**
      - alerts/charts/**
      - audit-logs/charts/**
      - blackbox-exporter/charts/**
      - cert-manager/charts/**
      - doop-api/charts/**
      - exposed-services/charts/v2.0.0/exposed-service/**
      - gatekeeper/charts/**
      - gatekeeper-config/charts/**
      - gatekeeper-doop/charts/**
      - kafka/charts/**
      - kube-monitoring/charts/**
      - kubeconfig-generator/chart/**
      - logshipper/chart/**
      - obenbao/charts/**
      - opensearch/chart/**
      - logs/charts/**
      - perses/charts/**
      - service-proxy/charts/1.0.0/service-proxy/**
      - thanos/charts/**
      - trust-manager/charts/**
      - oidc-discovery-access/**
      - netapp-monitoring/charts/**
      - k8s-gateway-api/charts/**

jobs:
  helm-release-external-dns:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@4a36aa4e13e96d49b6d17f29da005f6cdb42b15b
    permissions:
      contents: read
      packages: write
    with:
      chart-dir: external-dns/charts
      chart-name: external-dns
      allow-existing: true

  helm-release-absent-metrics-operator:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@4a36aa4e13e96d49b6d17f29da005f6cdb42b15b
