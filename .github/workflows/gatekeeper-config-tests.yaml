name: gatekeeper-config tests

on:
  pull_request:
    paths:
      - gatekeeper-config/**
      - .github/workflows/gatekeeper-config-tests.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gator-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v3.19.5"

      - name: Install gator
        env:
          GATOR_VERSION: v3.22.2
        run: |
          curl -sL "https://github.com/open-policy-agent/gatekeeper/releases/download/${GATOR_VERSION}/gator-${GATOR_VERSION}-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gator
          gator version

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"

      - name: Install helm-manifest-generator and helm-manifest-parser
        run: go install github.com/sapcc/gatekeeper-addons/helm-manifest-generator@latest github.com/sapcc/gatekeeper-addons/helm-manifest-parser@latest

      - name: Run gator tests
        run: |
          set -o pipefail
          gatekeeper-config/tests/run.sh | tee /tmp/gator.log

      - name: Summarize results
        if: always()
        run: |
          PASSED=$(grep -c -- "--- PASS:" /tmp/gator.log) || PASSED=0
          FAILED=$(grep -c -- "--- FAIL:" /tmp/gator.log) || FAILED=0
          {
            echo "## gator results"
            echo ""
            echo "${PASSED} passed, ${FAILED} failed"
          } >> "$GITHUB_STEP_SUMMARY"
