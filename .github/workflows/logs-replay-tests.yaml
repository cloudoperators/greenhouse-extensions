name: logs replay tests

on:
  pull_request:
    paths:
      - logs/**
      - .github/workflows/logs-replay-tests.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortigate-cef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.19.5"

      - name: Install PyYAML
        run: python3 -c 'import yaml' || pip install pyyaml

      - name: Replay FortiGate fixtures through the syslog transforms
        run: logs/tests/replay-fortigate-cef.sh
