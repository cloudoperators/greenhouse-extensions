{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.auditLogs.ingesterCollector.enabled (include "auditLogs.ingesterCollector.serviceMonitorEnabled" .) -}}
{{- $root := . -}}
{{- range $name, $cfg := .Values.auditLogs.ingesterCollector.collectors -}}
{{- if and $cfg.enabled $cfg.topic }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opentelemetry-collector-audit-ingester-{{ $name }}
  labels:
    {{- include "plugin.labels" $root | nindent 4 }}
    {{- if $root.Values.auditLogs.customLabels }}
    {{ toYaml $root.Values.auditLogs.customLabels | nindent 4 }}
    {{- end }}
    {{- include "plugin.prometheusLabels" $root | nindent 4 }}
spec:
  endpoints:
    - port: prometheus
      interval: 60s
      scrapeTimeout: 50s
      path: /metrics
      scheme: http
      relabelings:
        - regex: pod
          action: labeldrop
  # The OpenTelemetry Operator creates three Services per collector with
  # identical app.kubernetes.io/* labels (base, headless, monitoring).
  # Restrict to the base Service so /metrics is scraped exactly once.
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: {{ $root.Release.Namespace }}.audit-ingester-{{ $name }}
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/part-of: opentelemetry
      operator.opentelemetry.io/collector-service-type: base
{{- end }}
{{- end }}
{{- end }}
