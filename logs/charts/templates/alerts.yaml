{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.openTelemetry.prometheus.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-alerts" $.Release.Name | trunc 63 }}
  labels:
    {{- include "plugin.labels" . | nindent 4 }}
    {{- include "plugin.prometheusLabels" . | nindent 4 }}
{{- if $.Values.openTelemetry.prometheus.rules.labels }}
{{ toYaml $.Values.openTelemetry.prometheus.rules.labels | indent 4 }}
{{- end }}
{{- if $.Values.openTelemetry.prometheus.rules.annotations }}
  annotations:
{{ toYaml $.Values.openTelemetry.prometheus.rules.annotations | indent 4 }}
{{- end }}
spec:
  groups:
  - name: logs-plugin-alerts
    rules:
  {{- if (has "FilelogRefusedLogs" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FilelogRefusedLogs
        expr: sum(rate(otelcol_receiver_refused_log_records{receiver=~"filelog"}[1m])) > 0
        for: 5m
        labels:
          severity: warning
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.filelogRefusedLogs }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: Logs are not successfully pushed into the filelog-receiver
          description: Filelog receiver is increasingly rejecting logs
  {{- end }}

  {{- if (has "ReceiverRefusedLogs" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: ReceiverRefusedLogs
        expr: sum by (k8s_cluster_name, receiver) (rate(otelcol_receiver_refused_log_records{job=~".*/opentelemetry-collector-logs"}[1m])) > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.receiverRefusedLogs }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel receiver {{`{{ $labels.receiver }}`}} is refusing log records on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'The {{`{{ $labels.receiver }}`}} receiver on {{`{{ $labels.k8s_cluster_name }}`}} is rejecting log records. Check the receiver configuration and the log source on affected nodes.'
  {{- end }}

  {{- if (has "ReceiverRefusedMetric" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: ReceiverRefusedMetric
        expr: sum(rate(otelcol_receiver_refused_metric_points{}[1m])) > 0
        for: 5m
        labels:
          severity: warning
          no_alert_on_absence: "true" # OTel will not expose the metric if null
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.receiverRefusedMetric }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel is refusing metric points
          description: The OTel Collector has refused metric points for over 5 minutes. This may indicate malformed metrics. Review configuration and incoming traffic for issues.
  {{- end }}

  {{- if (has "OTelLogsMissing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsMissing
        expr: sum by (region, k8s_node_name, pod) (rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs", exporter !~"debug"}[60m])) == 0
        for: 120m
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsMissing }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_node_name }}`}} in {{`{{ $labels.region }}`}} are not shipping logs. Please check.'
          summary: OTel is not shipping logs
  {{- end }}

  {{- if and (has "ReconcileErrors" .Values.openTelemetry.prometheus.rules.enabled) (index .Values "opentelemetry-operator" "enabled") }}
      - alert: ReconcileErrors
        expr: rate(controller_runtime_reconcile_total{controller="opentelemetrycollector",result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.reconcileErrors }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OpenTelemetryCollector Reconciliation
          description: Reconciliation errors for OTel are increasing
  {{- end }}

  {{- if and (has "WorkqueueDepth" .Values.openTelemetry.prometheus.rules.enabled) (index .Values "opentelemetry-operator" "enabled") }}
      - alert: WorkqueueDepth
        expr: rate(workqueue_depth{controller="opentelemetrycollector"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.workqueueDepth }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: WorkqueueDepth is increasing
          description: Check OTel manager logs for reasons why this might happen
  {{- end }}

  {{- if (has "OTelLogsIncreasing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsIncreasing
        expr: sum(increase(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) / sum(increase(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h]offset 2h)) by (k8s_cluster_name) > 4
        for: 6h
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: '{{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsIncreasing }}'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are sending 4 times more logs in the last 6h. Please check.'
          summary: OTel log volume is increasing, check log volume.
  {{- end }}

  {{- if (has "OTelLogsDecreasing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsDecreasing
        expr: sum(rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h]offset 2h)) by (k8s_cluster_name)/sum(rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) > 4
        for: 2h
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: '{{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsDecreasing }}'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are sending 4 times fewer logs in the last 2h. Please check.'
          summary: OTel log volume is decreasing, check log volume.
  {{- end }}

  {{- if (has "OTelLogsExportingFailed" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsExportingFailed
        expr: sum(increase(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name)/ sum(increase(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs"}[1h]) + increase(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) < 0.9
        for: 1h
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: '{{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsExportingFailed }}'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are exporting logs below 90%. Please check.'
          summary: OTel log exporting is failing. Check logs and exporter connectivity.
  {{- end }}

  {{- if (has "OTelLogsSLOBurnRateCritical" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsSLOBurnRateCritical
        expr: |
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
            )
          ) > (14 * 0.005)
          and on(k8s_cluster_name)
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
            )
          ) > (14 * 0.005)
        for: 2m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsSLOBurnRateCritical }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel log export SLO burn rate critical (14x)
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are burning the export error budget at 14x rate. Budget will be exhausted in ~2 days.'
  {{- end }}

  {{- if (has "OTelLogsSLOBurnRateWarning" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsSLOBurnRateWarning
        expr: |
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
            )
          ) > (6 * 0.005)
          and on(k8s_cluster_name)
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
            )
          ) > (6 * 0.005)
        for: 15m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsSLOBurnRateWarning }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel log export SLO burn rate elevated (6x)
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are burning the export error budget at 6x rate. Budget will be exhausted in ~4.5 days.'
  {{- end }}

  {{- if (has "OTelLogsExportFailureRatioHigh" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsExportFailureRatioHigh
        expr: |
          sum by (k8s_cluster_name, exporter) (
            rate(otelcol_exporter_send_failed_log_records{
              job=~".*/opentelemetry-collector-logs",
              exporter!~"debug"
            }[10m])
          )
          /
          (
            sum by (k8s_cluster_name, exporter) (
              rate(otelcol_exporter_sent_log_records{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
            +
            sum by (k8s_cluster_name, exporter) (
              rate(otelcol_exporter_send_failed_log_records{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
          ) > 0.1
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsExportFailureRatioHigh }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel export failure ratio above 10% for exporter {{`{{ $labels.exporter }}`}}'
          description: 'OTel collector on {{`{{ $labels.k8s_cluster_name }}`}} has >10% export failures on exporter {{`{{ $labels.exporter }}`}} for 5+ minutes. Current failure ratio: {{`{{ $value | humanizePercentage }}`}}.'
  {{- end }}

  {{- if (has "OTelExporterQueueFilling" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelExporterQueueFilling
        expr: |
          (
            otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
            /
            otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
          ) > 0.8
          and
          otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"} > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelExporterQueueFilling }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel exporter queue {{`{{ $labels.exporter }}`}} is above 80% capacity'
          description: 'Queue for exporter {{`{{ $labels.exporter }}`}} on {{`{{ $labels.k8s_node_name }}`}} is at {{`{{ $value | humanizePercentage }}`}} capacity. If this reaches 100% with block_on_overflow=true, the collector will stall.'
  {{- end }}

  {{- if (has "OTelExporterQueueFull" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelExporterQueueFull
        expr: |
          (
            otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
            /
            otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
          ) >= 1.0
          and
          otelcol_exporter_queue{job=~".*/opentelemetry-collector-logs", exporter!~"debug"} > 0
        for: 2m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelExporterQueueFull }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel exporter queue {{`{{ $labels.exporter }}`}} is full — pipeline stalled'
          description: 'Exporter queue {{`{{ $labels.exporter }}`}} on {{`{{ $labels.k8s_node_name }}`}} is 100% full. New log records are blocked. Immediate action required.'
  {{- end }}

  {{- if (has "OTelLogsVolumeSpike" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsVolumeSpike
        expr: |
          (
            sum by (k8s_cluster_name) (
              rate(otelcol_receiver_accepted_log_records{
                job=~".*/opentelemetry-collector-logs"
              }[5m])
            )
            /
            sum by (k8s_cluster_name) (
              rate(otelcol_receiver_accepted_log_records{
                job=~".*/opentelemetry-collector-logs"
              }[1h] offset 1h)
            )
          ) > 5
          and on(k8s_cluster_name)
          sum by (k8s_cluster_name) (
            rate(otelcol_receiver_accepted_log_records{
              job=~".*/opentelemetry-collector-logs"
            }[1h] offset 1h)
          ) > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsVolumeSpike }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Log volume on {{`{{ $labels.k8s_cluster_name }}`}} is 5x above baseline'
          description: 'Cluster {{`{{ $labels.k8s_cluster_name }}`}} is receiving logs at 5x the hourly baseline rate. This may indicate a logging misconfiguration, a noisy application, or a log injection attempt.'
  {{- end }}

  {{- if (has "OTelLogsVolumeDropFast" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsVolumeDropFast
        expr: |
          (
            sum by (k8s_cluster_name) (
              rate(otelcol_exporter_sent_log_records{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
            /
            sum by (k8s_cluster_name) (
              rate(otelcol_exporter_sent_log_records{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[1h] offset 1h)
            )
          ) < 0.2
          and on(k8s_cluster_name)
          sum by (k8s_cluster_name) (
            rate(otelcol_exporter_sent_log_records{
              job=~".*/opentelemetry-collector-logs",
              exporter!~"debug"
            }[1h] offset 1h)
          ) > 0
        for: 10m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsVolumeDropFast }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Log volume dropped >80% vs 1h baseline on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'OTel on {{`{{ $labels.k8s_cluster_name }}`}} is exporting less than 20% of its 1-hour baseline volume. Detected within 10 minutes vs the previous 4-hour detection time.'
  {{- end }}

  {{- if and .Values.openTelemetry.externalCollector.enabled (has "ExternalCollectorMemoryHigh" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: ExternalCollectorMemoryHigh
        expr: |
          otelcol_process_memory_rss_bytes{job=~".*/opentelemetry-collector-external"}
          > 8589934592
        for: 5m
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.externalCollectorMemoryHigh }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'External collector memory high on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'External collector pod on {{`{{ $labels.k8s_node_name }}`}} in {{`{{ $labels.k8s_cluster_name }}`}} is using more than 8 GiB RSS. This typically indicates a Kafka exporter connection failure causing unbounded queue growth. Check kafka export errors and exporter queue sizes.'
  {{- end }}

  {{- if (has "OTelLogsDeadletterIndexGrowing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsDeadletterIndexGrowing
        expr: |
          sum by (k8s_cluster_name, index) (
            increase(otelcol_opensearch_exporter_on_error_docs_total{
              job=~".*ingester.*"
            }[30m])
          ) > 0
        for: 1h
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsDeadletterIndexGrowing }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Logs routed to deadletter index on {{`{{ $labels.index }}`}}, {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'OpenSearch deadletter index {{`{{ $labels.index }}`}} on {{`{{ $labels.k8s_cluster_name }}`}} is receiving documents due to permanent indexing failures. Logs have been routed to the error index for at least 2 hours.'
  {{- end }}

  {{- if (has "OTelLogsDeadletterFlushFailing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsDeadletterFlushFailing
        expr: |
          sum by (k8s_cluster_name, index, failure_stage) (
            increase(otelcol_opensearch_exporter_on_error_flush_failures_total{
              job=~".*ingester.*"
            }[5m])
          ) > 0
        for: 5m
        labels:
          context: logshipping
          severity: critical
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.otelLogsDeadletterFlushFailing }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Deadletter index flush failing on {{`{{ $labels.index }}`}} ({{`{{ $labels.failure_stage }}`}}), {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'Failed to flush documents to the OpenSearch deadletter index {{`{{ $labels.index }}`}} at stage {{`{{ $labels.failure_stage }}`}} on {{`{{ $labels.k8s_cluster_name }}`}}. Documents are being dropped entirely — the error fallback itself is failing.'
  {{- end }}

  ##############################################################################
  # Falco fortlogs rules (CRITICAL priority only).
  #
  # Each alert fires when the opensearch-query-exporter sees one or more
  # Falco events for the matching rule name in the last 5 minutes. Queries
  # live in opensearch/chart/queries/falco-fortlogs.yaml and must be loaded
  # into the opensearch plugin via queryExporter.queries.
  ##############################################################################

  {{- if (has "FalcoOTelQueueRenameOrDelete" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelQueueRenameOrDelete
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_queue_rename_or_delete_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelQueueRenameOrDelete }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: OpenTelemetry persistent queue file modified on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A non-collector process renamed or deleted files on /var/lib/otel-queue inside an ingester pod. This destroys not-yet-flushed OpenSearch documents and is a strong tampering / data-loss signal (PCI-DSS 10.3).'
  {{- end }}

  {{- if (has "FalcoOTelOpenSearchCAWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelOpenSearchCAWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_opensearch_ca_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelOpenSearchCAWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: OpenSearch CA volume modified inside collector on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A write or delete occurred on the projected /etc/ssl/opensearch secret volume inside a logs/audit-logs collector. The volume is read-only by design; any write indicates a rogue sidecar, remount, or in-pod cert swap attempt.'
  {{- end }}

  {{- if (has "FalcoOTelKafkaCAWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelKafkaCAWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_kafka_ca_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelKafkaCAWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Kafka CA volume modified inside collector on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A write or delete occurred on /etc/ssl/kafka or /etc/ssl/audit-kafka inside a logs/audit-logs collector. These are projected read-only secret mounts; mutation indicates tampering with Kafka broker trust.'
  {{- end }}

  {{- if (has "FalcoOTelSyslogTLSWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelSyslogTLSWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_syslog_tls_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelSyslogTLSWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Syslog TLS secret modified inside external collector on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A write or delete occurred on the /etc/ssl/syslog-tls cert/key mount inside an external collector. The private key never rotates from inside the pod; this indicates key compromise or substitution.'
  {{- end }}

  {{- if (has "FalcoOTelElasticCertWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelElasticCertWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_elastic_cert_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelElasticCertWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Elastic client certs modified inside audit collector on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A write or delete occurred on the /etc/otel/certs mount inside an audit-logs collector. The elastic exporter certs are projected read-only; any mutation indicates tampering with exfiltration-path trust.'
  {{- end }}

  {{- if (has "FalcoOTelPodMountSyscall" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOTelPodMountSyscall
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_otel_pod_mount_syscall_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOTelPodMountSyscall }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: mount/umount syscall inside collector pod on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A mount or umount syscall was executed from inside a logs/audit-logs collector. Collectors do not need to mount anything at runtime; this is a strong indicator of volume remount tampering or privilege escalation.'
  {{- end }}

  {{- if (has "FalcoOpenSearchDataWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOpenSearchDataWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_opensearch_data_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOpenSearchDataWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: OpenSearch data dir written by non-server process on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A non-JVM process wrote under /usr/share/opensearch/data. Only the OpenSearch server should touch the shard store; this is tampering, index exfiltration staging, or an operator shell editing data.'
  {{- end }}

  {{- if (has "FalcoOpenSearchDataRenameOrDelete" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOpenSearchDataRenameOrDelete
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_opensearch_data_rename_or_delete_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOpenSearchDataRenameOrDelete }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: OpenSearch shard file modified by non-server process on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'An external process renamed, deleted, truncated, chmoded, or chowned a file under /usr/share/opensearch/data. This destroys shards or audit history (PCI-DSS 10.3).'
  {{- end }}

  {{- if (has "FalcoOpenSearchConfigWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOpenSearchConfigWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_opensearch_config_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOpenSearchConfigWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: OpenSearch config dir modified at runtime on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A non-trusted process wrote or deleted files under /usr/share/opensearch/config inside a data pod. The config volume is projected read-only; a runtime mutation means remount or in-pod tampering.'
  {{- end }}

  {{- if (has "FalcoOpenSearchDataExecve" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoOpenSearchDataExecve
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_opensearch_data_execve_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoOpenSearchDataExecve }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: execve from OpenSearch data dir on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A binary was executed from under /usr/share/opensearch/data. The server never runs code from the shard store; this almost always means an attacker dropped and launched a payload inside the pod.'
  {{- end }}

  {{- if (has "FalcoKafkaDataWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoKafkaDataWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_kafka_data_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoKafkaDataWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Kafka data dir written by non-broker process on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A non-broker process wrote to a Kafka JBOD data volume (/var/lib/kafka/data-*). This is tampering with the message log — segment integrity is compromised.'
  {{- end }}

  {{- if (has "FalcoKafkaDataRenameOrDelete" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoKafkaDataRenameOrDelete
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_kafka_data_rename_or_delete_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoKafkaDataRenameOrDelete }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Kafka data file modified by non-broker process on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'An external process renamed or deleted a file under a Kafka data volume. Normal rollover is broker-driven; external deletes destroy message history.'
  {{- end }}

  {{- if (has "FalcoKafkaConfigWrite" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoKafkaConfigWrite
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_kafka_config_write_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoKafkaConfigWrite }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: Kafka config modified at runtime on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A non-trusted process wrote to /opt/kafka/config, /opt/kafka/custom-config, or /tmp/strimzi.properties. Broker config is rendered from projected volumes; a runtime write means tampering (PCI-DSS 10.3.2).'
  {{- end }}

  {{- if (has "FalcoKafkaDataExecve" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: FalcoKafkaDataExecve
        expr: sum by (k8s_cluster_name) (opensearch_query_falco_kafka_data_execve_hits) > 0
        for: 0m
        labels:
          context: security
          severity: warning #depending on severity consideration: critical
          service: fortlogs
          no_alert_on_absence: "true"
          playbook: {{ .Values.openTelemetry.prometheus.rules.playbooksUrls.falcoKafkaDataExecve }}
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Falco: execve from Kafka data dir on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'A binary was executed from under /var/lib/kafka/data-*. The broker never runs code from the log store; this almost always means a dropped-and-executed payload inside the pod.'
  {{- end }}
{{- end }}
