{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.openTelemetry.prometheus.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-alerts" $.Release.Name | trunc 63 }}
  labels:
    {{- include "plugin.labels" . | nindent 4 }}
    {{- include "plugin.prometheusLabels" . | nindent 4 }}
{{- if $.Values.openTelemetry.prometheus.rules.labels }}
{{ toYaml $.Values.openTelemetry.prometheus.rules.labels | indent 4 }}
{{- end }}
{{- if $.Values.openTelemetry.prometheus.rules.annotations }}
  annotations:
{{ toYaml $.Values.openTelemetry.prometheus.rules.annotations | indent 4 }}
{{- end }}
spec:
  groups:
  - name: logs-plugin-alerts
    rules:
  {{- if (or (has "ReceiverRefusedLogs" .Values.openTelemetry.prometheus.rules.enabled) (has "FilelogRefusedLogs" .Values.openTelemetry.prometheus.rules.enabled)) }}
      - alert: ReceiverRefusedLogs
        expr: sum by (k8s_cluster_name, receiver) (rate(otelcol_receiver_refused_log_records_total{job=~".*/opentelemetry-collector-logs"}[1m])) > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/ReceiverRefusedLogs.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel receiver {{`{{ $labels.receiver }}`}} is refusing log records on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'The {{`{{ $labels.receiver }}`}} receiver on {{`{{ $labels.k8s_cluster_name }}`}} is rejecting log records. Check the receiver configuration and the log source on affected nodes.'
  {{- end }}

  {{- if (has "ReceiverRefusedMetric" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: ReceiverRefusedMetric
        expr: sum(rate(otelcol_receiver_refused_metric_points_total{}[1m])) > 0
        for: 5m
        labels:
          severity: warning
          no_alert_on_absence: "true" # OTel will not expose the metric if null
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/ReceiverRefusedMetric.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel is refusing metric points
          description: The OTel Collector has refused metric points for over 5 minutes. This may indicate malformed metrics. Review configuration and incoming traffic for issues.
  {{- end }}

  {{- if (has "OTelLogsMissing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsMissing
        expr: sum by (region, k8s_node_name, pod) (rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs", exporter !~"debug"}[60m])) == 0
        for: 120m
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsMissing.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_node_name }}`}} in {{`{{ $labels.region }}`}} are not shipping logs. Please check.'
          summary: OTel is not shipping logs
  {{- end }}

  {{- if and (has "ReconcileErrors" .Values.openTelemetry.prometheus.rules.enabled) (index .Values "opentelemetry-operator" "enabled") }}
      - alert: ReconcileErrors
        expr: rate(controller_runtime_reconcile_total{controller="opentelemetrycollector",result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/ReconcileErrors.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OpenTelemetryCollector Reconciliation
          description: Reconciliation errors for OTel are increasing
  {{- end }}

  {{- if and (has "WorkqueueDepth" .Values.openTelemetry.prometheus.rules.enabled) (index .Values "opentelemetry-operator" "enabled") }}
      - alert: WorkqueueDepth
        expr: rate(workqueue_depth{controller="opentelemetrycollector"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/WorkqueueDepth.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: WorkqueueDepth is increasing
          description: Check OTel manager logs for reasons why this might happen
  {{- end }}

  {{- if (has "OTelLogsIncreasing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsIncreasing
        expr: sum(increase(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) / sum(increase(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h]offset 2h)) by (k8s_cluster_name) > 4
        for: 6h
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/LogsOTelLogsIncreasing.md'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are sending 4 times more logs in the last 6h. Please check.'
          summary: OTel log volume is increasing, check log volume.
  {{- end }}

  {{- if (has "OTelLogsDecreasing" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsDecreasing
        expr: sum(rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h]offset 2h)) by (k8s_cluster_name)/sum(rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) > 4
        for: 2h
        labels:
          context: logshipping
          severity: warning
          no_alert_on_absence: "true"
          playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/LogsOTelLogsDecreasing.md'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are sending 4 times fewer logs in the last 2h. Please check.'
          summary: OTel log volume is decreasing, check log volume.
  {{- end }}

  {{- if (has "OTelLogsExportingFailed" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsExportingFailed
        expr: sum(increase(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name)/ sum(increase(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h]) + increase(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs"}[1h])) by (k8s_cluster_name) < 0.9
        for: 1h
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/LogsExportingFailed.md'
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are exporting logs below 90%. Please check.'
          summary: OTel log exporting is failing. Check logs and exporter connectivity.
  {{- end }}

  {{- if (has "OTelLogsSLOBurnRateCritical" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsSLOBurnRateCritical
        expr: |
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[1h]))
            )
          ) > (14 * 0.005)
          and on(k8s_cluster_name)
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[5m]))
            )
          ) > (14 * 0.005)
        for: 2m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsSLOBurnRate.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel log export SLO burn rate critical (14x)
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are burning the export error budget at 14x rate. Budget will be exhausted in ~2 days.'
  {{- end }}

  {{- if (has "OTelLogsSLOBurnRateWarning" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsSLOBurnRateWarning
        expr: |
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[6h]))
            )
          ) > (6 * 0.005)
          and on(k8s_cluster_name)
          (
            sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
            /
            (
              sum by (k8s_cluster_name) (rate(otelcol_exporter_sent_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
              + sum by (k8s_cluster_name) (rate(otelcol_exporter_send_failed_log_records_total{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}[30m]))
            )
          ) > (6 * 0.005)
        for: 15m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsSLOBurnRate.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: OTel log export SLO burn rate elevated (6x)
          description: 'OTel Collectors on {{`{{ $labels.k8s_cluster_name }}`}} are burning the export error budget at 6x rate. Budget will be exhausted in ~4.5 days.'
  {{- end }}

  {{- if (has "OTelLogsExportFailureRatioHigh" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsExportFailureRatioHigh
        expr: |
          sum by (k8s_cluster_name, exporter) (
            rate(otelcol_exporter_send_failed_log_records_total{
              job=~".*/opentelemetry-collector-logs",
              exporter!~"debug"
            }[10m])
          )
          /
          (
            sum by (k8s_cluster_name, exporter) (
              rate(otelcol_exporter_sent_log_records_total{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
            +
            sum by (k8s_cluster_name, exporter) (
              rate(otelcol_exporter_send_failed_log_records_total{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
          ) > 0.1
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsExportFailureRatioHigh.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel export failure ratio above 10% for exporter {{`{{ $labels.exporter }}`}}'
          description: 'OTel collector on {{`{{ $labels.k8s_cluster_name }}`}} has >10% export failures on exporter {{`{{ $labels.exporter }}`}} for 5+ minutes. Current failure ratio: {{`{{ $value | humanizePercentage }}`}}.'
  {{- end }}

  {{- if (has "OTelExporterQueueFilling" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelExporterQueueFilling
        expr: |
          (
            otelcol_exporter_queue_size{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
            /
            otelcol_exporter_queue_capacity{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
          ) > 0.8
          and
          otelcol_exporter_queue_capacity{job=~".*/opentelemetry-collector-logs", exporter!~"debug"} > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelExporterQueueFilling.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel exporter queue {{`{{ $labels.exporter }}`}} is above 80% capacity'
          description: 'Queue for exporter {{`{{ $labels.exporter }}`}} on {{`{{ $labels.k8s_node_name }}`}} is at {{`{{ $value | humanizePercentage }}`}} capacity. If this reaches 100% with block_on_overflow=true, the collector will stall.'
  {{- end }}

  {{- if (has "OTelExporterQueueFull" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelExporterQueueFull
        expr: |
          (
            otelcol_exporter_queue_size{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
            /
            otelcol_exporter_queue_capacity{job=~".*/opentelemetry-collector-logs", exporter!~"debug"}
          ) >= 1.0
          and
          otelcol_exporter_queue_capacity{job=~".*/opentelemetry-collector-logs", exporter!~"debug"} > 0
        for: 2m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelExporterQueueFilling.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'OTel exporter queue {{`{{ $labels.exporter }}`}} is full — pipeline stalled'
          description: 'Exporter queue {{`{{ $labels.exporter }}`}} on {{`{{ $labels.k8s_node_name }}`}} is 100% full. New log records are blocked. Immediate action required.'
  {{- end }}

  {{- if (has "OTelLogsVolumeSpike" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsVolumeSpike
        expr: |
          (
            sum by (k8s_cluster_name) (
              rate(otelcol_receiver_accepted_log_records_total{
                job=~".*/opentelemetry-collector-logs"
              }[5m])
            )
            /
            sum by (k8s_cluster_name) (
              rate(otelcol_receiver_accepted_log_records_total{
                job=~".*/opentelemetry-collector-logs"
              }[1h] offset 1h)
            )
          ) > 5
          and on(k8s_cluster_name)
          sum by (k8s_cluster_name) (
            rate(otelcol_receiver_accepted_log_records_total{
              job=~".*/opentelemetry-collector-logs"
            }[1h] offset 1h)
          ) > 0
        for: 5m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsVolumeAnomaly.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Log volume on {{`{{ $labels.k8s_cluster_name }}`}} is 5x above baseline'
          description: 'Cluster {{`{{ $labels.k8s_cluster_name }}`}} is receiving logs at 5x the hourly baseline rate. This may indicate a logging misconfiguration, a noisy application, or a log injection attempt.'
  {{- end }}

  {{- if (has "OTelLogsVolumeDropFast" .Values.openTelemetry.prometheus.rules.enabled) }}
      - alert: OTelLogsVolumeDropFast
        expr: |
          (
            sum by (k8s_cluster_name) (
              rate(otelcol_exporter_sent_log_records_total{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[10m])
            )
            /
            sum by (k8s_cluster_name) (
              rate(otelcol_exporter_sent_log_records_total{
                job=~".*/opentelemetry-collector-logs",
                exporter!~"debug"
              }[1h] offset 1h)
            )
          ) < 0.2
          and on(k8s_cluster_name)
          sum by (k8s_cluster_name) (
            rate(otelcol_exporter_sent_log_records_total{
              job=~".*/opentelemetry-collector-logs",
              exporter!~"debug"
            }[1h] offset 1h)
          ) > 0
        for: 10m
        labels:
          context: logshipping
          severity: info
          no_alert_on_absence: "true"
          playbook: https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsVolumeAnomaly.md
          {{- include "plugin.additionalRuleLabels" . | nindent 10 }}
        annotations:
          summary: 'Log volume dropped >80% vs 1h baseline on {{`{{ $labels.k8s_cluster_name }}`}}'
          description: 'OTel on {{`{{ $labels.k8s_cluster_name }}`}} is exporting less than 20% of its 1-hour baseline volume. Detected within 10 minutes vs the previous 4-hour detection time.'
  {{- end }}

{{- end }}
