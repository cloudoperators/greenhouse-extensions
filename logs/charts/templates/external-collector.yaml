{{- if and .Values.openTelemetry.externalCollector.enabled (or .Values.openTelemetry.externalCollector.externalConfig.enabled .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled .Values.openTelemetry.externalCollector.tracesConfig.enabled .Values.openTelemetry.externalCollector.externalHttpConfig.enabled) }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: external
  labels:
  {{- include "plugin.labels" . | nindent 4 }}
  {{- if .Values.openTelemetry.customLabels }}
  {{ toYaml .Values.openTelemetry.customLabels | nindent 4 }}
  {{- end }}
spec:
  mode: statefulset
  replicas: {{ .Values.openTelemetry.externalCollector.replicas }}
{{- with .Values.openTelemetry.externalCollector.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.openTelemetry.externalCollector.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.openTelemetry.externalCollector.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
  podAnnotations:
    kubectl.kubernetes.io/default-container: "otc-container"
{{- if not .Values.openTelemetry.kafka.enabled }}
    secret.reloader.stakater.com/reload: "otel-basic-auth{{- if eq (include "externalCollector.auditEnabled" .) "true" }},otel-syslog-audit-auth{{- end }}"
{{- end }}
  terminationGracePeriodSeconds: 10
  env:
    - name: cluster
      value: "{{ .Values.openTelemetry.cluster }}"
    - name: region
      value: "{{ .Values.openTelemetry.region }}"
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
{{- if not .Values.openTelemetry.kafka.enabled }}
  envFrom:
    - secretRef:
        name: otel-basic-auth
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    - secretRef:
        name: otel-syslog-audit-auth
{{- end }}
{{- end }}
  ports:
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
    - name: am-webhook
      port: {{ .Values.openTelemetry.externalCollector.externalConfig.alertmanager_port }}
      protocol: TCP
    - name: deploymentstcp
      port: {{ .Values.openTelemetry.externalCollector.externalConfig.deployments_port }}
      protocol: TCP
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogConfig.enabled }}
    - name: syslogtcp
      port: {{ .Values.openTelemetry.externalCollector.syslogConfig.tcp_port }}
      protocol: TCP
    - name: syslogudp
      port: {{ .Values.openTelemetry.externalCollector.syslogConfig.udp_port }}
      protocol: UDP
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    - name: syslogtcptls
      port: {{ .Values.openTelemetry.externalCollector.syslogTLSConfig.tcp_port }}
      protocol: TCP
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
    - name: otlp-grpc
      port: {{ .Values.openTelemetry.externalCollector.tracesConfig.otlp_grpc_port }}
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.openTelemetry.externalCollector.tracesConfig.otlp_http_port }}
      protocol: TCP
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
    - name: externalhttp
      port: {{ .Values.openTelemetry.externalCollector.externalHttpConfig.port }}
      protocol: TCP
{{- end }}
{{- if .Values.openTelemetry.prometheus.podMonitor.enabled }}
    - name: prometheus
      port: 8888
{{- end }}
  image: {{ index .Values "openTelemetry" "collectorImage" "repository" }}:{{ index .Values "openTelemetry" "collectorImage" "tag" }}
{{- if eq (include "externalCollector.tlsEnabled" .) "true" }}
  volumeMounts:
  - mountPath: /etc/ssl/syslog-tls
    name: syslog-tls
    readOnly: true
  volumes:
  - name: syslog-tls
    secret:
      secretName: logs-syslog-tls
{{- end }}
  config:
    receivers:
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
    {{- include "external.receiver" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogConfig.enabled }}
    {{- include "syslog.receiver" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_tls.receiver" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
    {{- include "traces.receiver" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
    {{- include "external_http.receiver" . | nindent 6 -}}
{{- end }}
    processors:
      batch:
        send_batch_max_size: 10000
        timeout: 5s
        send_batch_size: 5000
      attributes/cluster:
        actions:
          - action: insert
            key: k8s.cluster.name
            value: ${cluster}
          - action: insert
            key: region
            value: ${region}
{{- if not .Values.openTelemetry.kafka.enabled }}
      attributes/failover_username_a:
        actions:
          - action: insert
            key: failover_username_opensearch
            value: ${failover_username_a}
      attributes/failover_username_b:
        actions:
          - action: insert
            key: failover_username_opensearch
            value: ${failover_username_b}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
    {{- include "external.transform" . | nindent 6 -}}
{{- end }}
{{- if or .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_audit_filter.transform" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
    {{- include "external_http.transform" . | nindent 6 -}}
{{- end }}
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.processors" . | nindent 6 -}}
{{- end }}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 30
{{- if or .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
      transform/truncate_message:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # Attribute values map to keyword fields. Keep below Lucene's 32766-byte term limit or OpenSearch rejects the document.
              - "truncate_all(attributes, 540000)"
              - "truncate_all(resource.attributes, 540000)"
              - 'set(log.body, Substring(log.body, 0, {{ .Values.openTelemetry.externalCollector.maxMessageLength | int64 }})) where log.body != nil and Len(log.body) > {{ .Values.openTelemetry.externalCollector.maxMessageLength | int64 }}'
{{- end }}
      resource:
        attributes:
        - action: insert
          key: k8s.cluster.name
          value: ${cluster}
        - action: insert
          key: region
          value: ${region}
    exporters:
      debug:
        verbosity: basic
{{- if .Values.openTelemetry.kafka.enabled }}
      kafka:
        brokers:
{{- range .Values.openTelemetry.kafka.brokers }}
          - {{ . }}
{{- end }}
        protocol_version: {{ .Values.openTelemetry.kafka.protocol_version }}
        logs:
          topic: {{ .Values.openTelemetry.externalCollector.kafkaTopic }}
          encoding: {{ .Values.openTelemetry.kafka.encoding }}
        producer:
          compression: {{ .Values.openTelemetry.kafka.compression }}
        sending_queue:
          enabled: {{ .Values.openTelemetry.kafka.sendingQueue.enabled }}
          num_consumers: {{ .Values.openTelemetry.kafka.sendingQueue.numConsumers | default 1 | int64 }}
          queue_size: {{ .Values.openTelemetry.kafka.sendingQueue.queueSize | int64 }}
{{- if .Values.openTelemetry.kafka.tls.enabled }}
        tls:
          insecure: false
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
      kafka/traces:
        brokers:
{{- range .Values.openTelemetry.kafka.brokers }}
          - {{ . }}
{{- end }}
        protocol_version: {{ .Values.openTelemetry.kafka.protocol_version }}
        traces:
          topic: {{ .Values.openTelemetry.externalCollector.kafkaTracesTopic }}
          encoding: {{ .Values.openTelemetry.kafka.encoding }}
        producer:
          compression: {{ .Values.openTelemetry.kafka.compression }}
        sending_queue:
          enabled: {{ .Values.openTelemetry.kafka.sendingQueue.enabled }}
          num_consumers: {{ .Values.openTelemetry.kafka.sendingQueue.numConsumers | default 1 | int64 }}
          queue_size: {{ .Values.openTelemetry.kafka.sendingQueue.queueSize | int64 }}
{{- if .Values.openTelemetry.kafka.tls.enabled }}
        tls:
          insecure: false
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
    {{- include "external.exporter" . | nindent 6 -}}
{{- end }}
{{- if or .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_audit_filter.exporter" . | nindent 6 -}}
{{- end }}
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.exporter" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
    {{- include "external_http.exporter" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
    {{- include "traces.exporter" . | nindent 6 -}}
{{- end }}
    extensions:
{{- if .Values.openTelemetry.kafka.enabled }}
      opensearch_log_encoding: {}
{{- else }}
      basicauth/failover_a:
        client_auth:
          username: ${failover_username_a}
          password: ${failover_password_a}
      basicauth/failover_b:
        client_auth:
          username: ${failover_username_b}
          password: ${failover_password_b}
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.extensions" . | nindent 6 -}}
{{- end }}
{{- end }}
{{- if or (and (not .Values.openTelemetry.kafka.enabled) (or .Values.openTelemetry.externalCollector.externalConfig.enabled .Values.openTelemetry.externalCollector.tracesConfig.enabled .Values.openTelemetry.externalCollector.externalHttpConfig.enabled)) .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    connectors:
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
{{- if not .Values.openTelemetry.kafka.enabled }}
    {{- include "external.connectors" . | nindent 6 -}}
{{- end }}
{{- end }}
{{- if or .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_audit_filter.connectors" . | nindent 6 -}}
{{- end }}
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.connectors" . | nindent 6 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
{{- if not .Values.openTelemetry.kafka.enabled }}
    {{- include "traces.connectors" . | nindent 6 -}}
{{- end }}
{{- end }}
{{- end }}
    service:
      extensions:
{{- if .Values.openTelemetry.kafka.enabled }}
        - opensearch_log_encoding
{{- else }}
        - basicauth/failover_a
        - basicauth/failover_b
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.serviceExtensions" . | nindent 8 -}}
{{- end }}
{{- end }}
{{- if .Values.openTelemetry.prometheus.podMonitor.enabled }}
      telemetry:
        metrics:
          level: detailed
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
                  without_type_suffix: false
                  with_resource_constant_labels:
                    included:
                    - k8s_node_name
                    - k8s_cluster_name
                    - region
        resource:
          k8s_cluster_name: ${cluster}
          k8s_node_name: ${KUBE_NODE_NAME}
          region: ${region}
{{- end }}
      pipelines:
{{- if .Values.openTelemetry.externalCollector.externalConfig.enabled }}
    {{- include "external.pipeline" . | nindent 8 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogConfig.enabled }}
    {{- include "syslog.pipeline" . | nindent 8 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_tls.pipeline" . | nindent 8 -}}
{{- end }}
{{- if or .Values.openTelemetry.externalCollector.syslogConfig.enabled .Values.openTelemetry.externalCollector.syslogTLSConfig.enabled }}
    {{- include "syslog_audit_filter.pipeline" . | nindent 8 -}}
{{- end }}
{{- if eq (include "externalCollector.auditEnabled" .) "true" }}
    {{- include "external_audit_only.pipeline" . | nindent 8 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.externalHttpConfig.enabled }}
    {{- include "external_http.pipeline" . | nindent 8 -}}
{{- end }}
{{- if .Values.openTelemetry.externalCollector.tracesConfig.enabled }}
    {{- include "traces.pipeline" . | nindent 8 -}}
{{- end }}
{{- end }}
