{{- $root := . }}
{{- range $user := $root.Values.openTelemetry.kafka.users }}
{{- if dig "secret" "generate" false $user }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $user.secret.name | default (printf "kafka-user-%s-password" $user.name) }}
  labels:
  {{- include "plugin.labels" $root | nindent 4 }}
  {{- if $root.Values.openTelemetry.customLabels }}
  {{ toYaml $root.Values.openTelemetry.customLabels | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  password: {{ required (printf "user %q is missing secret.password" $user.name) $user.secret.password | quote }}
{{- end }}
{{- end }}

{{- range $user := $root.Values.openTelemetry.auditKafka.users }}
{{- if dig "secret" "generate" false $user }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $user.secret.name | default (printf "kafka-audit-user-%s-password" $user.name) }}
  labels:
  {{- include "plugin.labels" $root | nindent 4 }}
  {{- if $root.Values.openTelemetry.customLabels }}
  {{ toYaml $root.Values.openTelemetry.customLabels | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  password: {{ required (printf "user %q is missing secret.password" $user.name) $user.secret.password | quote }}
{{- end }}
{{- end }}
