#
# Syslog messages as they arrive from FortiGates sending directly, and the values the syslog transforms must set.
# Every field listed under `fields` is checked on every case; null means the attribute must not be set.
# `preset` sets attributes on the record before the transforms run, as the relay normalization would.
# Serial numbers, hosts and addresses are made up (RFC 5737 documentation ranges).

fields:
  - hw.id
  - host.partition
  - event.category
  - event.code
  - event.severity.text
  - security.threat.score
  - security.signature.severity.text
  - security_rule.group.id

cases:
  - name: prefixed traffic with threat score
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|00013|traffic:forward deny|3|deviceExternalId=FG100FTEST000001 FTNTFGTeventtime=1792456821923810305 FTNTFGTlogid=0000000013 cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd=root src=192.0.2.10 spt=45140 dst=198.51.100.20 dpt=2345 proto=6 act=deny FTNTFGTpolicyid=12 FTNTFGTpolicytype=policy app=tcp_1024-5000 FTNTFGTcrscore=30 FTNTFGTcraction=131072 FTNTFGTcrlevel=high'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: forward
      event.code: "0000000013"
      event.severity.text: notice
      security.threat.score: 30
      security.signature.severity.text: high
      security_rule.group.id: "12"

  - name: prefixed ips keeps signature severity unset
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|16384|utm:ips signature|7|deviceExternalId=FG100FTEST000001 FTNTFGTeventtime=1792456114460872380 FTNTFGTlogid=0419016384 cat=utm:ips FTNTFGTsubtype=ips FTNTFGTeventtype=signature FTNTFGTlevel=alert FTNTFGTvd=root FTNTFGTseverity=critical src=203.0.113.5 dst=198.51.100.20 act=dropped proto=6 app=HTTP FTNTFGTpolicyid=14 FTNTFGTpolicytype=policy FTNTFGTcrscore=50 FTNTFGTcrlevel=critical spt=34284 dpt=80'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: ips
      event.code: "0419016384"
      event.severity.text: alert
      security.threat.score: 50
      security.signature.severity.text: null
      security_rule.group.id: "14"

  - name: prefixed event without policy or score
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|32011|event:system|3|deviceExternalId=FG100FTEST000001 FTNTFGTeventtime=1792456645879428077 FTNTFGTlogid=0100032011 cat=event:system FTNTFGTsubtype=system FTNTFGTlevel=notice FTNTFGTvd=root FTNTFGTlogdesc=Disk log rolled act=roll-log reason=file-size msg=Disk log has rolled.'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: system
      event.code: "0100032011"
      event.severity.text: notice
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: non-numeric crscore is skipped
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|00013|traffic:forward deny|3|deviceExternalId=FG100FTEST000001 FTNTFGTlogid=0000000013 cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd=root src=192.0.2.10 dst=198.51.100.20 act=deny FTNTFGTpolicyid=12 FTNTFGTcrscore=12abc FTNTFGTcrlevel=high'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: forward
      event.code: "0000000013"
      event.severity.text: notice
      security.threat.score: null
      security.signature.severity.text: high
      security_rule.group.id: "12"

  - name: unprefixed keys only set hw.id and event.code
    message: 'CEF:0|Fortinet|FortiGate-1001F|7.4.8,build2795 (GA)|0000000011|forward traffic dns|6|start=Oct 15 2026 12:00:59 logver=704082795 deviceExternalId=FG1K1FTEST000002 dvchost=fw-test-02 vd=root eventtime=1792065659050030978 tz=+0800 logid=0000000011 cat=traffic subtype=forward deviceSeverity=warning src=192.0.2.11 spt=55166 dst=198.51.100.53 dpt=53 proto=17 act=dns policyid=17 policytype=policy app=DNS crscore=5 craction=262144 crlevel=low msg=Connection Failed'
    expect:
      hw.id: FG1K1FTEST000002
      host.partition: null
      event.category: null
      event.code: "0000000011"
      event.severity.text: null
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: native fortios key=value log is left alone
    message: '<189>date=2026-10-15 time=11:58:45 devname="fw-test-03" devid="FG481FTEST000003" eventtime=1792065524658981803 logid="0000000013" type="traffic" subtype="forward" level="notice" vd="root" srcip=192.0.2.12 srcport=58786 dstip=198.51.100.161 dstport=161 proto=17 action="accept" policyid=11 policytype="policy" service="UDP_20_65535"'
    expect:
      hw.id: null
      host.partition: null
      event.category: null
      event.code: null
      event.severity.text: null
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: other vendor with the same key names is left alone
    message: 'CEF:0|Example|Appliance|1.0|100|example event|3|deviceExternalId=EX0000000001 logid=0000000001 FTNTFGTvd=root FTNTFGTcrscore=10 src=192.0.2.13 dst=198.51.100.1'
    expect:
      hw.id: null
      host.partition: null
      event.category: null
      event.code: null
      event.severity.text: null
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: fields set earlier are kept
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|00013|traffic:forward deny|3|deviceExternalId=FG100FTEST000004 FTNTFGTlogid=0000000013 cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd=root src=192.0.2.14 dst=198.51.100.20 act=deny FTNTFGTpolicyid=12 FTNTFGTcrscore=30 FTNTFGTcrlevel=high'
    preset:
      event.code: preset-code
      security_rule.group.id: preset-policy
    expect:
      hw.id: FG100FTEST000004
      host.partition: root
      event.category: forward
      event.code: preset-code
      event.severity.text: notice
      security.threat.score: 30
      security.signature.severity.text: high
      security_rule.group.id: preset-policy

  - name: ipsec is not ips and crscore can be the last key
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|37138|event:vpn|3|deviceExternalId=FG100FTEST000001 FTNTFGTlogid=0101037138 cat=event:vpn FTNTFGTsubtype=ipsec FTNTFGTlevel=notice FTNTFGTvd=root FTNTFGTcrlevel=low FTNTFGTcrscore=5'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: ipsec
      event.code: "0101037138"
      event.severity.text: notice
      security.threat.score: 5
      security.signature.severity.text: low
      security_rule.group.id: null

  - name: empty, malformed and oversized values are skipped without errors
    message: 'CEF:0|Fortinet|Fortigate|v7.4.12|00013|traffic:forward deny|3|deviceExternalId=FG100FTEST000001 FTNTFGTlogid=13abc cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd= src=192.0.2.10 dst=198.51.100.20 act=deny FTNTFGTpolicyid= FTNTFGTcrscore=99999999999999999999 FTNTFGTcrlevel= msg=x'
    expect:
      hw.id: FG100FTEST000001
      host.partition: null
      event.category: forward
      event.code: null
      event.severity.text: notice
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: logid inside a native fortios message is not used
    message: '<189>date=2026-10-15 time=11:58:45 devname="fw-test-03" devid="FG481FTEST000003" logid="0100032001" type="event" subtype="system" level="notice" vd="root" msg="filter changed: logid=5 now excluded"'
    expect:
      hw.id: null
      host.partition: null
      event.category: null
      event.code: null
      event.severity.text: null
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: keys inside a native fortios message are not used
    message: '<189>date=2026-10-15 time=11:58:45 devname="fw-test-03" devid="FG481FTEST000003" logid="0100032001" type="event" subtype="system" level="notice" vd="root" msg="filter changed: deviceExternalId=FG100FTEST999999 FTNTFGTvd=root FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTcrscore=5 FTNTFGTcrlevel=low FTNTFGTpolicyid=1 now excluded"'
    expect:
      hw.id: null
      host.partition: null
      event.category: null
      event.code: null
      event.severity.text: null
      security.threat.score: null
      security.signature.severity.text: null
      security_rule.group.id: null

  - name: cef after a syslog header is still parsed
    message: '<189>Oct 15 12:00:00 fw-test-01 CEF:0|Fortinet|Fortigate|v7.4.12|00013|traffic:forward deny|3|deviceExternalId=FG100FTEST000001 FTNTFGTlogid=0000000013 cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd=root src=192.0.2.10 dst=198.51.100.20 act=deny FTNTFGTpolicyid=12 FTNTFGTcrscore=30 FTNTFGTcrlevel=high'
    expect:
      hw.id: FG100FTEST000001
      host.partition: root
      event.category: forward
      event.code: "0000000013"
      event.severity.text: notice
      security.threat.score: 30
      security.signature.severity.text: high
      security_rule.group.id: "12"
