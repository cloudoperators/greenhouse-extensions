#
# promtool unit tests for templates/alerts.yaml, run by test-alerts.sh against the rules rendered for namespace "logs".
# The series use the label sets the collectors export: send_failed carries error_type/error_permanent, a failover
# connector reports next to its per-level exporters, and only components with a sending_queue have queue_capacity.
# Every alert is checked in every case, so a case also proves that the other rules stay silent.

rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # loss behind a failover connector whose levels have no queue: Both levels skipped: the connector drops 19% (send_failed); the levels only see the failures that triggered failover. Counted once, at the connector.
  - name: 'loss behind a failover connector whose levels have no queue'
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_capacity{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="failover/opensearch",data_type="logs"}'
        values: '1000x420'
      - series: 'otelcol_exporter_sent_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="failover/opensearch"}'
        values: '0+4980x420'
      - series: 'otelcol_exporter_send_failed_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="failover/opensearch",error_type="_OTHER",error_permanent="false"}'
        values: '0+1176x420'
      - series: 'otelcol_exporter_sent_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="opensearch/failover_a"}'
        values: '0+4980x420'
      - series: 'otelcol_exporter_send_failed_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="opensearch/failover_a",error_type="Deadline_Exceeded",error_permanent="true"}'
        values: '0+5x420'
      - series: 'otelcol_exporter_send_failed_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="opensearch/failover_b",error_type="Deadline_Exceeded",error_permanent="true"}'
        values: '0+1x420'
    alert_rule_test:
      - eval_time: 400m
        alertname: FilelogRefusedLogs
        exp_alerts: []
      - eval_time: 400m
        alertname: ReceiverRefusedLogs
        exp_alerts: []
      - eval_time: 400m
        alertname: ReceiverRefusedMetric
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsMissing
        exp_alerts: []
      - eval_time: 400m
        alertname: ReconcileErrors
        exp_alerts: []
      - eval_time: 400m
        alertname: WorkqueueDepth
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsIncreasing
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsDecreasing
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsExportingFailed
        exp_alerts:
          - exp_labels:
              context: 'logshipping'
              job: 'logs/opentelemetry-collector-logs'
              k8s_cluster_name: 'cluster-a'
              no_alert_on_absence: 'true'
              playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/LogsExportingFailed.md'
              severity: 'info'
            exp_annotations:
              description: 'OTel Collectors (logs/opentelemetry-collector-logs) on cluster-a are exporting logs below 90%. Please check.'
              summary: 'OTel log exporting is failing. Check logs and exporter connectivity.'
      - eval_time: 400m
        alertname: OTelLogsSLOBurnRateCritical
        exp_alerts:
          - exp_labels:
              context: 'logshipping'
              job: 'logs/opentelemetry-collector-logs'
              k8s_cluster_name: 'cluster-a'
              no_alert_on_absence: 'true'
              playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsSLOBurnRate.md'
              severity: 'warning'
            exp_annotations:
              description: 'OTel Collectors (logs/opentelemetry-collector-logs) on cluster-a are burning the export error budget at 14x rate. Budget will be exhausted in ~2 days.'
              summary: 'OTel log export SLO burn rate critical (14x)'
      - eval_time: 400m
        alertname: OTelLogsSLOBurnRateWarning
        exp_alerts:
          - exp_labels:
              context: 'logshipping'
              job: 'logs/opentelemetry-collector-logs'
              k8s_cluster_name: 'cluster-a'
              no_alert_on_absence: 'true'
              playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsSLOBurnRate.md'
              severity: 'info'
            exp_annotations:
              description: 'OTel Collectors (logs/opentelemetry-collector-logs) on cluster-a are burning the export error budget at 6x rate. Budget will be exhausted in ~4.5 days.'
              summary: 'OTel log export SLO burn rate elevated (6x)'
      - eval_time: 400m
        alertname: OTelLogsExportFailureRatioHigh
        exp_alerts:
          - exp_labels:
              context: 'logshipping'
              exporter: 'failover/opensearch'
              job: 'logs/opentelemetry-collector-logs'
              k8s_cluster_name: 'cluster-a'
              no_alert_on_absence: 'true'
              playbook: 'https://github.com/cloudoperators/greenhouse-extensions/tree/main/logs/playbooks/OTelLogsExportFailureRatioHigh.md'
              severity: 'info'
            exp_annotations:
              description: 'OTel collector (logs/opentelemetry-collector-logs) on cluster-a has >10% export failures on exporter failover/opensearch for 5+ minutes. Current failure ratio: 19.1%.'
              summary: 'OTel export failure ratio above 10% for exporter failover/opensearch'
      - eval_time: 400m
        alertname: OTelExternalLogsDropped
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelExporterQueueFilling
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelExporterQueueFull
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsVolumeSpike
        exp_alerts: []
      - eval_time: 400m
        alertname: OTelLogsVolumeDropFast
        exp_alerts: []
  # level a fails, level b delivers: No queue on the levels: the connector hands every record to level b, nothing is lost and nothing may fire.
  - name: 'level a fails, level b delivers'
    interval: 1m
