      - series: 'otelcol_exporter_sent_log_records_total{job="logs/opentelemetry-collector-logs",namespace="logs",pod="logs-collector-a",k8s_cluster_name="cluster-a",k8s_node_name="node-a",service_name="otelcol-contrib",exporter="opensearch/failover_b"}'
