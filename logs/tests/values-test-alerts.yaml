# Enables every alert rule for test-alerts.sh, on top of logs/charts/ci/test-values.yaml.
openTelemetry:
  prometheus:
    rules:
      enabled:
        - FilelogRefusedLogs
        - ReceiverRefusedLogs
        - ReceiverRefusedMetric
        - OTelLogsMissing
        - ReconcileErrors
        - WorkqueueDepth
        - OTelLogsIncreasing
        - OTelLogsDecreasing
        - OTelLogsExportingFailed
        - OTelLogsSLOBurnRateCritical
        - OTelLogsSLOBurnRateWarning
        - OTelLogsExportFailureRatioHigh
        - OTelExternalLogsDropped
        - OTelExporterQueueFilling
        - OTelExporterQueueFull
        - OTelLogsVolumeSpike
        - OTelLogsVolumeDropFast
