# OpenSearch mode for tests/validate-collector-configs.sh: turn on every collector pipeline so the rendered configs can
# be checked with `otelcol validate` against the pinned collectorImage from charts/values.yaml (no image override here).
opentelemetry-operator:
  enabled: false
customCRDs:
  enabled: true
openTelemetry:
  openSearchLogs:
    endpoint: https://opensearch.example:9200
    failover_username_a: test
    failover_password_a: test
    failover_username_b: test
    failover_password_b: test
  cluster: test
  region: test
  kafka:
    enabled: false
  logsCollector:
    enabled: true
    journaldConfig:
      enabled: true
    k8seventsConfig:
      enabled: true
    containerdConfig:
      enabled: true
    cephConfig:
      enabled: true
    kvmConfig:
      enabled: true
    openstackConfig:
      enabled: true
  externalCollector:
    enabled: true
    externalIP: 10.0.0.1
    externalConfig:
      enabled: true
    syslogConfig:
      enabled: true
      openSearchLogs:
        auditEndpoint: https://opensearch.example:9200
        nonAuditEndpoint: https://opensearch.example:9200
        audit_failover_username_a: test
        audit_failover_password_a: test
        audit_failover_username_b: test
        audit_failover_password_b: test
    syslogTLSConfig:
      enabled: true
      issuerName: test
      dnsName: syslog.example
    syslogHttpConfig:
      enabled: true
    externalHttpConfig:
      enabled: true
      auditKafkaBrokers:
        - kafka.example:9094
    tracesConfig:
      enabled: true
  metricsCollector:
    enabled: true
