{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.kafka.enabled .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-alerts" .Values.kafka.name | trunc 63 }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    {{- with .Values.monitoring.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kafka.rules
      rules:
        - alert: KafkaConsumerLagTooHigh
          expr: sum by (topic, consumergroup) (kafka_consumergroup_lag{namespace="{{ .Release.Namespace }}", topic!="__consumer_offsets", consumergroup!=""}) > 1000
          for: 15m
          labels:
            severity: warning
            playbook: {{ .Values.monitoring.playbooksUrls.kafkaConsumerLagTooHigh }}
            {{- include "kafka.alert-labels" . | nindent 12 }}
          annotations:
            summary: Kafka consumer lag is too high.
            description: 'Consumer group {{`{{ $labels.consumergroup }}`}} on topic {{`{{ $labels.topic }}`}} has a lag of {{`{{ printf "%.0f" $value }}`}} messages.'
{{- range $name, $topic := .Values.topics }}
{{- if and $topic.enabled $topic.retention }}
{{- $retentionMs := int64 $topic.retention }}
{{- $thresholdSeconds := div $retentionMs 2000 }}
        # One alert per enabled topic with `retention` set. Alert threshold = 50% of retention time and that lag is increasing.
        - alert: KafkaConsumerLagRetentionRisk
          expr: |-
            (
              sum by (topic, consumergroup) (kafka_consumergroup_lag{namespace="{{ $.Release.Namespace }}", topic="{{ $name }}", consumergroup!=""})
              /
              on(topic) group_left()
              clamp_min(
                sum by (topic) (rate(kafka_topic_partition_current_offset{namespace="{{ $.Release.Namespace }}", topic="{{ $name }}"}[1h])),
                1
              )
            ) > {{ $thresholdSeconds }}
            and
            sum by (topic, consumergroup) (deriv(kafka_consumergroup_lag{namespace="{{ $.Release.Namespace }}", topic="{{ $name }}", consumergroup!=""}[30m])) > 0
          for: 30m
          labels:
            severity: critical
            topic: {{ $name }}
            playbook: {{ $.Values.monitoring.playbooksUrls.kafkaConsumerLagRetentionRisk }}
            {{- include "kafka.alert-labels" $ | nindent 12 }}
          annotations:
            summary: 'Consumer {{`{{ $labels.consumergroup }}`}} at risk of data loss on {{ $name }}'
            description: 'Consumer group {{`{{ $labels.consumergroup }}`}} on topic {{ $name }} is falling behind. At current produce rate, projected drain time is {{`{{ printf "%.0f" $value }}`}}s — more than half of the configured {{ div $retentionMs 1000 }}s retention. Messages may expire before being consumed.'
{{- end }}
{{- end }}
        - alert: KafkaUnderReplicatedPartitions
          expr: sum by (topic) (kafka_topic_partition_under_replicated_partition{namespace="{{ .Release.Namespace }}"}) > 0
          for: 15m
          labels:
            severity: critical
            playbook: {{ .Values.monitoring.playbooksUrls.kafkaUnderReplicatedPartitions }}
            {{- include "kafka.alert-labels" . | nindent 12 }}
          annotations:
            summary: Kafka has under-replicated partitions.
            description: 'Topic {{`{{ $labels.topic }}`}} has {{`{{ printf "%.0f" $value }}`}} under-replicated partition(s).'
        - alert: KafkaNoBrokersOnline
          expr: absent(kafka_server_kafkaserver_brokerstate{namespace="{{ .Release.Namespace }}"})
          for: 5m
          labels:
            severity: critical
            playbook: {{ .Values.monitoring.playbooksUrls.kafkaNoBrokersOnline }}
            {{- include "kafka.alert-labels" . | nindent 12 }}
          annotations:
            summary: Kafka in namespace {{ .Release.Namespace }} has no brokers online.
            description: No Kafka brokers in namespace {{ .Release.Namespace }} are reporting metrics. The cluster is likely down.
{{- end }}
