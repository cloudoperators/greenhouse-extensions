apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opensearch.labels" . | nindent 4 }}
stringData:
  config.yml: |-
    _meta:
      type: "config"
      config_version: 2
    config:
      dynamic:
        kibana:
          server_username: {{ .Values.cluster.usersCredentials.dashboards.username }}
        http:
          {{- if .Values.auth.oidc.enabled }}
          anonymous_auth_enabled: true
          xff:
            enabled: false
          {{- else }}
          anonymous_auth_enabled: false
          xff:
            enabled: true
            internalProxies: '.*'  # Trust all internal proxies (service-proxy)
            remoteIpHeader: 'x-forwarded-for'
          {{- end }}
        authc:
          {{- if not .Values.auth.oidc.enabled }}
          proxy_auth_domain:
            description: "Authenticate via proxy headers from OAuth2 proxy"
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: proxy
              challenge: false
              config:
                user_header: "x-forwarded-user"
                roles_header: "x-forwarded-groups"
                roles_separator: ","
            authentication_backend:
              type: noop
          {{- end }}
          basic_internal_auth_domain:
            description: "Authenticate via HTTP Basic against internal users database"
            http_enabled: true
            transport_enabled: true
            {{- if .Values.auth.oidc.enabled }}
            order: 1
            http_authenticator:
              type: basic
              challenge: false
            {{- else }}
            order: 1
            http_authenticator:
              type: basic
              challenge: true
            {{- end }}
            authentication_backend:
              type: intern
          {{- if .Values.auth.oidc.enabled }}
          openid_auth_domain:
            description: "Authenticate via OpenID Connect"
            http_enabled: true
            transport_enabled: false
            order: 2
            http_authenticator:
              type: openid
              challenge: true
              config:
                subject_key: {{ .Values.auth.oidc.subjectKey | quote }}
                roles_key: {{ .Values.auth.oidc.rolesKey | quote }}
                openid_connect_url: {{ .Values.auth.oidc.provider | quote }}
                enable_ssl: true
                {{- if .Values.auth.oidc.caPath }}
                openid_connect_idp:
                  enable_ssl: true
                  pemtrustedcas_filepath: {{ .Values.auth.oidc.caPath | quote }}
                {{- end }}
            authentication_backend:
              type: noop
          {{- end }}

  internal_users.yml: |-
    _meta:
      type: "internalusers"
      config_version: 2
    admin:
      hash: {{ .Values.cluster.usersCredentials.admin.hash | quote }}
      reserved: true
      backend_roles:
        - "admin"

  roles.yml: |-
    _meta:
      type: "roles"
      config_version: 2

  roles_mapping.yml: |-
    _meta:
      type: "rolesmapping"
      config_version: 2
    all_access:
      reserved: false
      backend_roles:
        - "admin"
      users:
        - "admin"

  tenants.yml: |-
    _meta:
      type: "tenants"
      config_version: 2

  audit.yml: |-
    _meta:
      type: "audit"
      config_version: 2
    config:
      enabled: {{ .Values.cluster.cluster.security.audit.enabled }}
      audit:
        enable_rest: true
        enable_transport: true
        resolve_bulk_requests: false
        log_request_body: true
        resolve_indices: true
        exclude_sensitive_headers: true
        ignore_users:
          - kibanaserver
        ignore_requests: []
        disabled_rest_categories:
          - AUTHENTICATED
          - GRANTED_PRIVILEGES
        disabled_transport_categories:
          - AUTHENTICATED
          - GRANTED_PRIVILEGES
      compliance:
        enabled: true
        internal_config: true
        external_config: false
        read_metadata_only: true
        read_ignore_users:
          - kibanaserver
        read_watched_fields: {}
        # Index patterns whose document writes (create/update/delete) are audited.
        # Empty by default (no document-write auditing); set per cluster in values.
        write_watched_indices:
          {{- toYaml .Values.cluster.cluster.security.audit.writeWatchedIndices | nindent 10 }}
        write_metadata_only: {{ .Values.cluster.cluster.security.audit.writeMetadataOnly }}
        write_log_diffs: {{ .Values.cluster.cluster.security.audit.writeLogDiffs }}
        write_ignore_users:
          {{- toYaml .Values.cluster.cluster.security.audit.writeIgnoreUsers | nindent 10 }}
