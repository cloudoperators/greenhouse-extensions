{{- if or .Values.thanos.query.enabled (and .Values.thanosCommunity.query.enabled (not (empty .Values.thanos.query.stores))) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "release.name" . }}-sd-config
  labels:  
    {{- include "plugin.labels" . | nindent 4 }}  
    {{- include "thanosParent.labels" . | nindent 4 }}  
    {{- if .Values.thanos.query.deploymentLabels }}  
    {{- toYaml .Values.thanos.query.deploymentLabels | nindent 4 }}  
    {{- end }}
data:
  endpoint-targets.yaml: |-
{{- if .Values.thanosCommunity.query.enabled }}
    default_client_config:
      tls_config:
        enabled: true
        cert_file: /etc/tls/server/tls.crt
        key_file:  /etc/tls/server/tls.key
        ca_file:   /etc/tls/client/ca.crt
{{- end }}
    endpoints:
{{- /* Technically it is possible to add stores and have the default stores all together.*/}}
{{- if not (empty .Values.thanos.query.stores) }}
{{- range .Values.thanos.query.stores }}
      - address: "{{ . }}"
{{- end -}}
{{- else }}
      - address: "kube-monitoring-prometheus:10901"
      - address: "{{ include "release.name" . }}-store:{{ default "10901" .Values.thanos.grpcAddress }}"
{{- end }}
{{- end }}